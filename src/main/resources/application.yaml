spring:
  application:
    name: cabinet
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 300000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        name: CABINET_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  moderation:
    # Bootstrap only: these accounts can appoint the community team through the dashboard.
    admin-emails: ${ADMIN_EMAILS:}
  notifications:
    sse:
      max-per-user: ${SSE_MAX_CONNECTIONS_PER_USER:3}
      max-total: ${SSE_MAX_TOTAL_CONNECTIONS:1000}

external:
  omdb:
    base-url: https://www.omdbapi.com
    api-key: ${OMDB_API_KEY:}
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: ${TMDB_API_KEY:}
    access-token: ${TMDB_ACCESS_TOKEN:}
  google-books:
    base-url: https://www.googleapis.com/books/v1
    api-key: ${GOOGLE_BOOKS_API_KEY:}
  musicbrainz:
    base-url: https://musicbrainz.org/ws/2
    user-agent: ${MUSICBRAINZ_USER_AGENT:cabinet/1.0 (https://github.com/scriptles/cabinet)}
  the-audio-db:
    base-url: https://www.theaudiodb.com/api/v1/json
    api-key: ${THEAUDIODB_API_KEY:123}
  wikidata:
    sparql-url: https://query.wikidata.org/sparql
    user-agent: ${WIKIDATA_USER_AGENT:cabinet/1.0 (https://github.com/scriptles/cabinet)}
    read-timeout: ${WIKIDATA_READ_TIMEOUT:30s}
