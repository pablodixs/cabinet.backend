spring:
  application:
    name: cabinet
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        name: CABINET_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

external:
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: ${TMDB_API_KEY:}
    access-token: ${TMDB_ACCESS_TOKEN:}
  google-books:
    base-url: https://www.googleapis.com/books/v1
    api-key: ${GOOGLE_BOOKS_API_KEY:}
  musicbrainz:
    base-url: https://musicbrainz.org/ws/2
    user-agent: ${MUSICBRAINZ_USER_AGENT:cabinet/1.0 (https://github.com/scriptles/cabinet)}
  the-audio-db:
    base-url: https://www.theaudiodb.com/api/v1/json
    api-key: ${THEAUDIODB_API_KEY:123}
  wikidata:
    sparql-url: https://query.wikidata.org/sparql
    user-agent: ${WIKIDATA_USER_AGENT:cabinet/1.0 (https://github.com/scriptles/cabinet)}
