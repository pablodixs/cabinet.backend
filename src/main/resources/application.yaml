spring:
  application:
    name: cabinet
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 300000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        name: CABINET_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        partitioned: ${SESSION_COOKIE_PARTITIONED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches

catalog:
  outbox:
    poll-delay: ${CATALOG_OUTBOX_POLL_DELAY:1000}
    lock-timeout: ${CATALOG_OUTBOX_LOCK_TIMEOUT:15m}
  tmdb-changes:
    cron: ${CATALOG_TMDB_CHANGES_CRON:0 30 3 * * *}
    zone: ${CATALOG_TMDB_CHANGES_ZONE:America/Sao_Paulo}
    batch-size: ${CATALOG_TMDB_CHANGES_BATCH_SIZE:500}
    initial-window: ${CATALOG_TMDB_CHANGES_INITIAL_WINDOW:2d}
  collections:
    tmdb-sync:
      cron: ${CATALOG_COLLECTION_TMDB_SYNC_CRON:0 0 5 * * *}
      zone: ${CATALOG_COLLECTION_TMDB_SYNC_ZONE:America/Sao_Paulo}
      stale-after: ${CATALOG_COLLECTION_TMDB_SYNC_STALE_AFTER:24h}
      locale: ${CATALOG_COLLECTION_TMDB_SYNC_LOCALE:pt-BR}
  staleness:
    movie:
      future: ${CATALOG_STALE_MOVIE_FUTURE:24h}
      recent: ${CATALOG_STALE_MOVIE_RECENT:3d}
      catalog: ${CATALOG_STALE_MOVIE_CATALOG:30d}
    series:
      active: ${CATALOG_STALE_SERIES_ACTIVE:24h}
      inactive: ${CATALOG_STALE_SERIES_INACTIVE:30d}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://cabinetbeta.vercel.app}
  moderation:
    # Bootstrap only: these accounts can appoint the community team through the dashboard.
    admin-emails: ${ADMIN_EMAILS:}
  notifications:
    sse:
      max-per-user: ${SSE_MAX_CONNECTIONS_PER_USER:3}
      max-total: ${SSE_MAX_TOTAL_CONNECTIONS:1000}

external:
  omdb:
    base-url: https://www.omdbapi.com
    api-key: ${OMDB_API_KEY:}
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: ${TMDB_API_KEY:}
    access-token: ${TMDB_ACCESS_TOKEN:}
  google-books:
    base-url: https://www.googleapis.com/books/v1
    api-key: ${GOOGLE_BOOKS_API_KEY:}
  musicbrainz:
    base-url: https://musicbrainz.org/ws/2
    user-agent: ${MUSICBRAINZ_USER_AGENT:cabinet/1.0 (https://github.com/scriptles/cabinet)}
  the-audio-db:
    base-url: https://www.theaudiodb.com/api/v1/json
    api-key: ${THEAUDIODB_API_KEY:123}
  wikidata:
    sparql-url: https://query.wikidata.org/sparql
    user-agent: ${WIKIDATA_USER_AGENT:cabinet/1.0 (https://github.com/scriptles/cabinet)}
    read-timeout: ${WIKIDATA_READ_TIMEOUT:30s}
