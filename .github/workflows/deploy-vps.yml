name: Deploy Cabinet to Oracle VPS

env:
  TZ: America/Sao_Paulo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Choose whether to deploy or inspect recent backend logs
        type: choice
        options:
          - deploy
          - logs
        default: deploy
        required: true

concurrency:
  group: cabinet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: sh ./mvnw --batch-mode --no-transfer-progress test

      - name: Package application artifact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          bundle="$(mktemp -d)"
          trap 'rm -rf "$bundle"' EXIT
          sh ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          artifact="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$artifact"
          cp "$artifact" "$bundle/app.jar"
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'OMDB_API_KEY=%s\n' "$OMDB_API_KEY"
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
            printf 'TMDB_ACCESS_TOKEN=%s\n' "$TMDB_ACCESS_TOKEN"
            printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS"
          } > "$bundle/.cabinet-runtime.env"
          tar -C "$bundle" -czf /tmp/cabinet-source.tar.gz .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cabinet_deploy
          chmod 600 ~/.ssh/cabinet_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with restricted SSH command
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: cat /tmp/cabinet-source.tar.gz | ssh -i ~/.ssh/cabinet_deploy "$VPS_USER@$VPS_HOST"

      - name: Verify public endpoint
        run: curl --fail --retry 8 --retry-delay 3 --retry-all-errors https://cabinet.healtie.app/v1/auth/csrf

  view-logs:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'logs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure restricted SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cabinet_deploy
          chmod 600 ~/.ssh/cabinet_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Show recent Cabinet stack traces
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -i ~/.ssh/cabinet_deploy "$VPS_USER@$VPS_HOST" logs
