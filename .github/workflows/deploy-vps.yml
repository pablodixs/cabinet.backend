name: Deploy Cabinet to Oracle VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cabinet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Package source
        run: tar --exclude=.git --exclude=target --exclude='.local' -czf /tmp/cabinet-source.tar.gz .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cabinet_deploy
          chmod 600 ~/.ssh/cabinet_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with restricted SSH command
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: cat /tmp/cabinet-source.tar.gz | ssh -i ~/.ssh/cabinet_deploy "$VPS_USER@$VPS_HOST"

      - name: Verify public endpoint
        run: curl --fail --retry 8 --retry-delay 3 --retry-all-errors https://cabinet.healtie.app/actuator/health
